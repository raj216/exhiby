<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B58"/>
      <stop offset="100%" stop-color="#FF0040"/>
    </linearGradient>
    <linearGradient id="electricText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B58"/>
      <stop offset="100%" stop-color="#FF0040"/>
    </linearGradient>
  </defs>

  <!-- Background: Carbon Black -->
  <rect width="512" height="512" rx="96" fill="#0F0F11"/>

  <!-- "E" lettermark centered — bold, Clash Display style -->
  <!-- Built as geometric shapes to match the brand feel -->

  <!-- Outer E shape -->
  <rect x="148" y="148" width="52" height="216" rx="8" fill="url(#electric)"/>
  <!-- Top bar -->
  <rect x="148" y="148" width="216" height="52" rx="8" fill="url(#electric)"/>
  <!-- Middle bar -->
  <rect x="148" y="232" width="180" height="48" rx="8" fill="url(#electric)"/>
  <!-- Bottom bar -->
  <rect x="148" y="312" width="216" height="52" rx="8" fill="url(#electric)"/>
</svg>
