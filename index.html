<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Exhiby - Live Studio Access</title>
    <meta name="google-site-verification" content="9szeBoOoxtYBnAOrWfj2mHwOcJe86qv0OZrI3C6D2RA" />
    <meta name="description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">
    <meta name="author" content="Exhiby" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joinexhiby.com/" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/zwpV8t5i7fPgbsUHl2s84aN8Gk33/social-images/social-1772120556343-Support_your_favorite_artists_—_live._(2).webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Exhiby" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/zwpV8t5i7fPgbsUHl2s84aN8Gk33/social-images/social-1772120556343-Support_your_favorite_artists_—_live._(2).webp">

    <!-- canonical is set per-route via react-helmet-async -->

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B58" />

    <!-- Preconnect to font CDNs — establishes TCP/TLS before fonts are requested -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Non-blocking font loading (loadCSS pattern).
         Fonts load AFTER first paint — never delay FCP or LCP.
         font-display:swap in the URLs handles text flash gracefully. -->
    <link rel="preload" as="style"
          href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap">
    </noscript>

    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
    </noscript>

    <meta property="og:title" content="Exhiby - Live Studio Access">
    <meta name="twitter:title" content="Exhiby - Live Studio Access">
    <meta property="og:description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">
    <meta name="twitter:description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">

    <!-- Instant loading shell: prevents white flash and gives FCP before JS arrives.
         React replaces the #root innerHTML on first render, removing this spinner. -->
    <style>
      html, body { margin: 0; background: #0f0f11; }
      #app-shell {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0f0f11;
      }
      #app-shell .s {
        width: 20px; height: 20px;
        border: 2px solid rgba(255,68,68,.2);
        border-top-color: #ff4444;
        border-radius: 50%;
        animation: _s .7s linear infinite;
      }
      @keyframes _s { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Exhiby",
      "url": "https://joinexhiby.com",
      "logo": "https://joinexhiby.com/android-chrome-512x512.png",
      "description": "Premium live art experiences and creator marketplace",
      "sameAs": [
        "https://twitter.com/Exhiby",
        "https://instagram.com/exhiby",
        "https://facebook.com/exhiby",
        "https://tiktok.com/@exhiby",
        "https://linkedin.com/company/exhiby"
      ]
    }
    </script>
    <div id="root">
      <!-- Pre-React shell: shows immediately while JS downloads. React replaces this. -->
      <div id="app-shell"><div class="s"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
