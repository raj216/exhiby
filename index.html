<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Exhiby - Live Studio Access</title>
    <meta name="google-site-verification" content="9szeBoOoxtYBnAOrWfj2mHwOcJe86qv0OZrI3C6D2RA" />
    <meta name="description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">
    <meta name="author" content="Exhiby" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joinexhiby.com/" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/zwpV8t5i7fPgbsUHl2s84aN8Gk33/social-images/social-1772120556343-Support_your_favorite_artists_—_live._(2).webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Exhiby" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/zwpV8t5i7fPgbsUHl2s84aN8Gk33/social-images/social-1772120556343-Support_your_favorite_artists_—_live._(2).webp">

    <!-- canonical is set per-route via react-helmet-async -->

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B58" />

    <!-- Preconnect to font CDNs — establishes TCP/TLS before fonts are requested -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Non-blocking font loading (loadCSS pattern).
         Fonts load AFTER first paint — never delay FCP or LCP.
         font-display:swap in the URLs handles text flash gracefully. -->
    <link rel="preload" as="style"
          href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap">
    </noscript>

    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
    </noscript>

    <meta property="og:title" content="Exhiby - Live Studio Access">
    <meta name="twitter:title" content="Exhiby - Live Studio Access">
    <meta property="og:description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">
    <meta name="twitter:description" content="Enter live creative studios. Watch artists work, learn in real time, and join curated ticketed sessions.">

    <!-- Instant brand splash: paints the LCP element (Exhiby wordmark) from
         static HTML in <1s, before any JS downloads. React replaces #root on
         first render, handing off to the live auth screen in the same position.
         All values are the app's real design tokens (src/index.css):
           --background      hsl(240 7% 6%)  #0F0F11
           --gradient-electric  linear-gradient(135deg, hsl(7 100% 67%), hsl(345 100% 50%))
           --muted-foreground   hsl(45 5% 55%)
         font-display = Clash Display (loads async, same swap behaviour the
         real auth screen already uses — not a regression). -->
    <style>
      html, body { margin: 0; background: #0F0F11; }
      #app-shell {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 0 24px;
        background:
          radial-gradient(circle at 50% 38%, hsl(7 100% 67% / 0.06), transparent 60%),
          #0F0F11;
        text-align: center;
      }
      #app-shell h1 {
        margin: 0;
        font-family: "Clash Display", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        font-size: clamp(3.75rem, 11vw, 6rem);
        /* Neon glow — exact base state from ClosedDoor's textShadow keyframe */
        text-shadow:
          0 0 20px hsl(7 100% 67% / 0.5),
          0 0 40px hsl(7 100% 67% / 0.3),
          0 0 60px hsl(7 100% 67% / 0.1);
      }
      #app-shell h1 span {
        background: linear-gradient(135deg, hsl(7 100% 67%), hsl(345 100% 50%));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      #app-shell p {
        margin: 18px 0 0;
        max-width: 20rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 0.9375rem;
        color: hsl(45 5% 55%);
      }
    </style>
  </head>

  <body>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Exhiby",
      "url": "https://joinexhiby.com",
      "logo": "https://joinexhiby.com/android-chrome-512x512.png",
      "description": "Premium live art experiences and creator marketplace",
      "sameAs": [
        "https://twitter.com/Exhiby",
        "https://instagram.com/exhiby",
        "https://facebook.com/exhiby",
        "https://tiktok.com/@exhiby",
        "https://linkedin.com/company/exhiby"
      ]
    }
    </script>
    <div id="root">
      <!-- Pre-React brand splash: paints instantly, React replaces on mount -->
      <div id="app-shell">
        <h1><span>Exhiby</span></h1>
        <p>Support your favorite artists — live.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
